<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' book: data: blob:; img-src book: data: blob: 'self' https: http:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src book: data: 'self';"
    />
    <title>FishReader</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <!-- 无边框窗口的八向缩放手感靠这几个热区自己实现 -->
    <div class="rz" data-edge="n"></div>
    <div class="rz" data-edge="s"></div>
    <div class="rz" data-edge="w"></div>
    <div class="rz" data-edge="e"></div>
    <div class="rz corner" data-edge="nw"></div>
    <div class="rz corner" data-edge="ne"></div>
    <div class="rz corner" data-edge="sw"></div>
    <div class="rz corner" data-edge="se"></div>

    <header id="toolbar" class="chrome toolbar">
      <div class="tb-drag">
        <span id="bookTitle" class="tb-title">FishReader</span>
      </div>
      <div class="tb-actions">
        <button class="tb-btn" data-act="open" title="打开文件  Ctrl+O">
          <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 13.2V4.6c0-.6.5-1.1 1.1-1.1h3l1.4 1.7h4.4c.6 0 1.1.5 1.1 1.1v6.9z" />
            <path d="M2 7.4h12" />
          </svg>
        </button>
        <button class="tb-btn" data-act="toc" title="目录  Ctrl+T">
          <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
            <path d="M3 4.2h10M3 8h10M3 11.8h6.5" />
          </svg>
        </button>
        <button class="tb-btn" data-act="theme" title="切换黑底/白底  T">色</button>
        <button class="tb-btn" data-act="font-" title="缩小字号  -">A-</button>
        <button class="tb-btn" data-act="font+" title="放大字号  +">A+</button>
        <button class="tb-btn" data-act="line-" title="减小行距  [">距-</button>
        <button class="tb-btn" data-act="line+" title="加大行距  ]">距+</button>
        <button class="tb-btn" data-act="opacity-" title="更透明  Ctrl+-">淡</button>
        <button class="tb-btn" data-act="ontop" title="窗口置顶  P">顶</button>
        <button class="tb-btn danger" data-act="hide" title="立即隐藏  Alt+`">隐</button>
        <button class="tb-btn danger" data-act="quit" title="退出  Ctrl+Q">关</button>
      </div>
    </header>

    <main id="scroller" class="scroller">
      <div id="phantomTop" class="phantom"></div>
      <div id="pages" class="pages"></div>
      <div id="phantomBottom" class="phantom"></div>
      <div id="loading" class="loading">载入中…</div>
    </main>

    <div id="empty" class="empty">
      <div class="empty-inner">
        <p class="empty-tip">把 <b>.txt</b> / <b>.epub</b> 拖进来</p>
        <button class="empty-btn" data-act="open">选择文件</button>
        <p class="empty-keys">滚轮阅读 · Ctrl+T 目录 · T 换色 · Alt+` 隐藏</p>
      </div>
    </div>

    <aside id="toc" class="toc" aria-hidden="true">
      <div class="toc-head">
        <span id="tocCount">目录</span>
        <button class="tb-btn" data-act="toc-close" title="关闭  Esc">收</button>
      </div>
      <div id="tocList" class="toc-list"></div>
    </aside>

    <footer id="statusbar" class="chrome statusbar">
      <span id="chapterName">未打开文件</span>
      <span id="percent">0%</span>
    </footer>

    <div id="toast" class="toast"></div>

    <script src="js/util.js"></script>
    <script src="js/epub-view.js"></script>
    <script src="js/toc.js"></script>
    <script src="js/reader.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
