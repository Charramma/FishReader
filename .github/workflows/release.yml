name: Build Windows Portable

# 打 tag（v*）时自动构建免安装 exe 并挂到 GitHub Release；
# 也支持在 Actions 页面手动触发，手动触发的产物只能从运行摘要里下载，不会建 Release。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --publish never 不能省：electron-builder 检测到 CI 环境会尝试自动发布
      - name: Build
        run: npx electron-builder --win portable --publish never

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FishReader-windows-portable
          path: release/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "FishReader $GITHUB_REF_NAME" \
            --generate-notes \
            release/*.exe
        shell: bash
